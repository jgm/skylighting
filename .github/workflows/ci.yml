name: CI tests

on: [push, pull_request]

jobs:
  linux:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions:
          - ghc: '9.6'
            cabal: '3.10'
            cabalopts: '--ghc-options=-Werror'
          - ghc: '9.8'
            cabal: 'latest'
            cabalopts: '--ghc-options=-Werror'
          - ghc: '9.10'
            cabal: 'latest'
            cabalopts: '--ghc-options=-Werror'
          - ghc: '9.12'
            cabal: 'latest'
            cabalopts: ''
          - ghc: '9.14'
            cabal: 'latest'
            cabalopts: ''
    steps:
    - uses: actions/checkout@v7

    - name: Install ghc/cabal
      run: |
        ghcup install ghc --set ${{ matrix.versions.ghc }}
        ghcup install cabal ${{ matrix.versions.cabal }}

    - name: Cache cabal global package db
      id:   cabal-global
      uses: actions/cache@v6
      with:
        path: |
          ~/.cabal
        key: ${{ runner.os }}-${{ matrix.versions.ghc }}-${{ matrix.versions.cabal }}-cabal-global-${{ secrets.CACHE_VERSION }}

    - name: Cache cabal work
      id:   cabal-local
      uses: actions/cache@v6
      with:
        path: |
          dist-newstyle
        key: ${{ runner.os }}-${{ matrix.versions.ghc }}-${{ matrix.versions.cabal }}-cabal-global-${{ secrets.CACHE_VERSION }}

    - name: Bootstrap
      run: |
          cabal update
          cabal build --only-dependencies -fexecutable --disable-optimization skylighting-core
          cabal build -fexecutable --disable-optimization ${{ matrix.versions.cabalopts }} skylighting-core
          cd skylighting
          cabal run skylighting-extract -fexecutable --disable-optimization -- ../skylighting-core/xml

    - name: Build and test
      run: |
          cabal build -fexecutable --enable-test --enable-benchmark --disable-optimization --only-dependencies all
          cabal test -fexecutable --disable-optimization ${{ matrix.versions.cabalopts }} --test-options="--hide-successes" all

  windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.18.2.0
    - name: Bootstrap
      shell: pwsh
      run: |
          $env:Path += ";$HOME\AppData\Roaming\local\bin"
          cabal update
          cabal build --only-dependencies -fexecutable --disable-optimization skylighting-core
          cabal build -fexecutable --disable-optimization --ghc-option=-Werror
          cd skylighting
          cabal run skylighting-extract -fexecutable --disable-optimization -- (get-item ..\skylighting-core\xml)
    - name: Build and test
      shell: cmd
      run: |
          chcp 65001
          cabal build -fexecutable --enable-test --enable-benchmark --disable-optimization --only-dependencies all
          cabal test -fexecutable --disable-optimization ${{ matrix.versions.cabalopts }} --test-options="--hide-successes" all


